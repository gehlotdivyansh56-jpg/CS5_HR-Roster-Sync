spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
  flyway:
    enabled: false
  kafka:
    listener:
      auto-startup: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

app:
  jwt:
    secret: MoveInSyncRosterSyncSuperSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong
    validity-minutes: 1440
  outbox:
    poll-interval-ms: 600000
    batch-size: 50
    max-retries: 3
    enabled: false
  kafka:
    enabled: false
    roster-events-topic: employee-roster-events
    dlq-topic: employee-events-dlq
